<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Hard circular mask — clips ALL content incl. filter bleed -->
    <mask id="circleMask">
      <circle cx="32" cy="32" r="31.5" fill="white"/>
    </mask>

    <!-- Crimson orb gradient — fills the WHOLE circle -->
    <radialGradient id="orbFill" cx="42%" cy="36%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ff7090"/>
      <stop offset="25%"  stop-color="#de1638"/>
      <stop offset="65%"  stop-color="#8a0a1e"/>
      <stop offset="100%" stop-color="#3a020e"/>
    </radialGradient>
  </defs>

  <!-- Everything inside this group is masked to a perfect circle -->
  <g mask="url(#circleMask)">
    <!-- Full-circle red orb — no bg, orb IS the icon -->
    <circle cx="32" cy="32" r="32" fill="url(#orbFill)"/>

    <!-- Top-left specular sheen -->
    <ellipse cx="21" cy="18" rx="12" ry="7.5" fill="rgba(255,255,255,0.15)"/>

    <!-- Left eye white -->
    <circle cx="22.5" cy="35" r="7" fill="white" opacity="0.97"/>
    <!-- Left pupil -->
    <circle cx="24" cy="36.2" r="2.8" fill="#5a000e" opacity="0.6"/>

    <!-- Right eye white -->
    <circle cx="41.5" cy="35" r="7" fill="white" opacity="0.97"/>
    <!-- Right pupil -->
    <circle cx="43" cy="36.2" r="2.8" fill="#5a000e" opacity="0.6"/>

    <!-- Inner rim glow (bottom) -->
    <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,80,100,0.25)" stroke-width="3"/>
  </g>
</svg>
