<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pointly Cursor Companion</title>
  <link rel="stylesheet" href="cursor.css">
</head>
<body>
  <div class="clicky-wrapper" id="clicky-wrapper">
    
    <!-- Ultra-Compact 26px Dark Red Cursor Buddy -->
    <div class="buddy-container" id="buddy-container">
      <div class="buddy-aura" id="buddy-aura"></div>
      <div class="buddy-orb" id="buddy-orb" title="Pointly (Hold Ctrl+Space to speak, Ctrl+T to type)">
        <div class="buddy-face">
          <span class="buddy-eye left"></span>
          <span class="buddy-eye right"></span>
        </div>
      </div>
    </div>

    <!-- Floating Transient Speech Bubble (Shows AI answers, guided steps, and draft previews) -->
    <div class="speech-bubble" id="speech-bubble">
      <div class="bubble-tail"></div>
      <div class="bubble-content" id="bubble-content">
        Ready. Hold <strong>Ctrl+Space</strong> to talk or <strong>Ctrl+T</strong> to type.
      </div>
      <!-- Guided Workflow Step Controller -->
      <div class="workflow-controls" id="workflow-controls">
        <span class="step-indicator" id="step-indicator">Step 1/3</span>
        <button type="button" class="btn-copy-draft" id="btn-copy-draft" title="Copy drafted email text">📋 Copy Draft</button>
        <button type="button" class="btn-next-step" id="btn-next-step" title="Proceed to next guided step">Next Step ➔</button>
      </div>
    </div>

    <!-- Minimal Expandable Typing Capsule -->
    <form class="type-capsule" id="type-capsule">
      <input
        type="text"
        id="capsule-input"
        class="capsule-input"
        placeholder="Type a task (e.g. draft mail in Word)..."
        autocomplete="off"
      />
      <button type="submit" class="capsule-send" id="capsule-send">↗</button>
    </form>

  </div>

  <!-- Screen Spotlight Beacon Ring (projects to found files / UI buttons) -->
  <div class="spotlight-beacon" id="spotlight-beacon">
    <div class="beacon-ring ring-1"></div>
    <div class="beacon-ring ring-2"></div>
    <div class="beacon-tag" id="beacon-tag">Target</div>
  </div>

  <script src="cursor.js"></script>
</body>
</html>
